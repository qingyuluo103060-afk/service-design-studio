services:
  - type: web
    name: service-design-studio
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ENABLE_USER_ACCOUNTS
        value: true
      - key: DATA_DIR
        value: /var/data
      - key: APP_ACCESS_CODE
        sync: false
    disk:
      name: service-design-data
      mountPath: /var/data
      sizeGB: 1
